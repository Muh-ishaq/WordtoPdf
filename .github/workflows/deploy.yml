name: Build, test, and deploy

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: [self-hosted, Windows, X64]
    env:
      APP_PORT: "8001"
      COMPOSE_PROJECT_NAME: cicd
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify Docker is using Linux containers
        shell: pwsh
        run: |
          $osType = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine is unavailable to the runner."
          }
          if ($osType -ne "linux") {
            throw "Switch Docker Desktop to Linux containers before building this app."
          }

      - name: Build image on Docker host
        run: docker compose build

  test:
    name: Run unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to local Docker host
    runs-on: [self-hosted, Windows, X64]
    needs:
      - build
      - test
    env:
      APP_PORT: "8001"
      COMPOSE_PROJECT_NAME: cicd
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Start updated application
        run: docker compose up --detach --force-recreate