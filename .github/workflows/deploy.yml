name: Build and deploy on push

on:
  push:
    branches:
      - main

env:
  APP_PORT: "8001"
  COMPOSE_PROJECT_NAME: cicd

jobs:
  build:
    name: Build image
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify Docker is using Linux containers
        shell: pwsh
        run: |
          $osType = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine is unavailable to the runner."
          }
          if ($osType -ne "linux") {
            throw "Switch Docker Desktop to Linux containers before building this app."
          }

      - run: docker compose build

  test:
    name: Run unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
#deploy
  deploy:
    name: Deploy container
    runs-on: windows-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --detach --force-recreate
